<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>

    <script>
      (function () {
        const TARGET = "https://cp.dalilps.com";

        let path = window.location.pathname
          .replace(/^\/Dalil(\/|$)/, "/")
          .replace(/^\/+/, "/");

        if (!path) path = "/";

        const target =
          TARGET +
          path +
          window.location.search +
          window.location.hash;

        window.location.replace(target);
      })();
    </script>

    <link rel="canonical" href="https://cp.dalilps.com" />

    <noscript>
      <meta http-equiv="refresh" content="0; url=https://cp.dalilps.com" />
    </noscript>
  </head>

  <body>
    <p>
      Redirecting to Dalil…
      <br />
      <a href="https://cp.dalilps.com">Click here if you are not redirected</a>
    </p>
  </body>
</html>
