<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>

    <script>
      (function () {
        const VERCEL_BASE = "https://dalil4cp.com";

        // Remove "/Dalil" or "/Dalil/" safely
        let path = window.location.pathname.replace(/^\/Dalil(\/|$)/, "/");

        const search = window.location.search || "";
        const hash = window.location.hash || "";

        // Normalize slashes
        if (path === "") path = "/";

        const target = VERCEL_BASE + path + search + hash;

        // Replace without adding history entry
        window.location.replace(target);
      })();
    </script>

    <!-- SEO canonical (keeps path) -->
    <link
      rel="canonical"
      href="https://dalil4cp.com"
    />

    <!-- No-JS fallback -->
    <noscript>
      <meta http-equiv="refresh" content="0; url=https://dalil4cp.com" />
    </noscript>
  </head>

  <body>
    <p>
      Redirecting to Dalil…
      <br />
      <a href="https://dalil4cp.com">Click here if you are not redirected</a>
    </p>
  </body>
</html>
